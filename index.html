<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Finance Manager</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- ================= LOCK SCREEN ================= -->

<div id="lockScreen">

    <div class="lockCard">

        <div class="lockIcon">🔐</div>

        <p class="smallTitle">PERSONAL FINANCE</p>

        <h1>
            FINANCE<br>
            <span>MANAGER</span>
        </h1>

        <p class="lockText">
            Your money. Your control.
        </p>

        <input
            id="passwordInput"
            type="password"
            placeholder="Enter password"
        >

        <button id="unlockButton">
            ENTER APP →
        </button>

        <p id="errorMessage"></p>

    </div>

</div>


<!-- ================= MAIN APP ================= -->

<div id="app">

    <!-- HEADER -->

    <header>

        <div class="headerText">

            <p class="smallTitle">
                WELCOME BACK
            </p>

            <h1>
                FINANCE<br>
                <span>MANAGER</span>
            </h1>

            <p class="subtitle">
                Take control of your money.
            </p>

        </div>


        <!-- ROBOT -->

        <div class="robot">

            <div class="antenna"></div>

            <div class="robotHead">

                <div class="eyes">
                    <div></div>
                    <div></div>
                </div>

                <div class="mouth"></div>

            </div>

            <div class="robotBody">

                <div class="robotScreen">
                    ₹
                </div>

                <div class="robotDot"></div>

            </div>

            <div class="arm left"></div>
            <div class="arm right"></div>

        </div>

    </header>


    <!-- ================= BALANCE ================= -->

    <div class="balanceCard">

        <div class="balanceTop">

            <div>

                <p class="cardTitle">
                    TOTAL BALANCE
                </p>

                <p class="available">
                    ● Available
                </p>

            </div>

            <div class="moneyIcon">
                ₹
            </div>

        </div>

        <h2 id="balance">
            ₹0
        </h2>

        <p class="balanceDescription">
            Your available money
        </p>

    </div>


    <!-- ================= SALARY ================= -->

    <div class="salaryCard">

        <div class="salaryIcon">
            💼
        </div>

        <div class="salaryInfo">

            <p>
                SALARY PER MONTH
            </p>

            <h2 id="salary">
                ₹0
            </h2>

        </div>

        <button id="salaryButton">
            + ADD
        </button>

    </div>


    <!-- ================= START MESSAGE ================= -->

    <div class="welcomeCard">

        <div>

            <p class="cardTitle">
                MONEY MANAGER
            </p>

            <h2>
                Stay in control 💪
            </h2>

            <p>
                Your expense tracker is coming next.
            </p>

        </div>

        <div class="welcomeRobot">
            🤖
        </div>

    </div>

</div>


<script src="script.js"></script>

</body>
</html>
